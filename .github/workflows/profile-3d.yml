name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate 3D contribution graph
        uses: yankeexe/js-github-profile-3d-contrib@main
        with:
          USERNAME: amire3m
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_REPOS: 100
          SETTING: night-rainbow
          BRANCH: output
